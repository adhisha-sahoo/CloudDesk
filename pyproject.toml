[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddesk"
version = "1.0.0"
description = "Approval-based infrastructure automation, with a free local AWS API environment"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "pydantic-settings==2.15.0",
  "httpx==0.28.1", "boto3==1.43.112", "moto[server]==5.2.4",
  "slack-sdk==3.45.0", "python-multipart==0.0.32"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.0"]

[tool.setuptools]
packages = ["clouddesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["terraform: requires a Terraform executable", "browser: requires Playwright and Chromium"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
